PLG_SYSTEM_PULSEANALYTICS="System - Pulse Analytics"
PLG_SYSTEM_PULSEANALYTICS_XML_DESCRIPTION="Pulse Analytics adds privacy-first web analytics to a Joomla site. It sets no cookies and never stores IP addresses. The script is about 3 KB. You need a Pulse Analytics account with a site registered for the same domain."
PLG_SYSTEM_PULSEANALYTICS_FIELD_DOMAIN="Domain"
PLG_SYSTEM_PULSEANALYTICS_FIELD_DOMAIN_DESC="Enter the domain this site is registered under in Pulse Analytics, for example example.com. If you leave it empty, the tracker uses the browser's own hostname, which is right for a site served on one domain."
PLG_SYSTEM_PULSEANALYTICS_FIELD_API="Custom API origin"
PLG_SYSTEM_PULSEANALYTICS_FIELD_API_DESC="If you route events through your own proxy, enter its origin here, for example https://example.com. Enter the origin only, without a path, because the tracker adds its own. Leave this empty if you have not set up a proxy."
