PLG_SYSTEM_PULSEANALYTICS="System - Pulse Analytics"
PLG_SYSTEM_PULSEANALYTICS_XML_DESCRIPTION="Privacy-first web analytics. No cookies, no personal data, and the script it adds to your pages is under 3 KB. Requires a Pulse Analytics account with a site registered for the same domain."
PLG_SYSTEM_PULSEANALYTICS_FIELD_DOMAIN="Domain"
PLG_SYSTEM_PULSEANALYTICS_FIELD_DOMAIN_DESC="The domain this site is registered under in Pulse Analytics, for example example.com. Leave empty to let the tracker use the browser's own hostname, which is correct for a site served on one domain."
PLG_SYSTEM_PULSEANALYTICS_FIELD_COMPANION="Record clicks, copies and form submits"
PLG_SYSTEM_PULSEANALYTICS_FIELD_COMPANION_DESC="Loads a second, separate script. It is a second request on purpose: the core script's size is a published claim and nothing is folded into it to make a feature look free."
PLG_SYSTEM_PULSEANALYTICS_FIELD_API="Custom API origin"
PLG_SYSTEM_PULSEANALYTICS_FIELD_API_DESC="Optional. Route events through your own proxy origin, for example https://example.com. A bare origin, not a full URL - the tracker appends its own path. Leave empty unless you have set a proxy up."
