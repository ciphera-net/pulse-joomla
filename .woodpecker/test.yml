# Runs on pull_request AND on push to main.
#
# A workflow that only runs on pull requests checks the proposal and never the
# branch that ships, so this one runs on both.
#
# This is a lighter gate on purpose. The real check installs Joomla 5 and 6 and
# reads the tag out of a rendered page (scripts/verify.sh), which needs a
# database server and a full CMS. This repository has no PHPUnit tests.
#
# What this covers: the syntax of every PHP file, that the plugin manifest and
# the update manifest are well-formed XML, and that the language files parse.
#
# What this does NOT cover: anything that happens inside Joomla (the event
# wiring, asset registration, the exact bytes of the rendered tag, the
# `version => false` option), and PHP syntax newer than 8.3. Run
# scripts/verify.sh before a release.
when:
  - event: pull_request
  - event: push
    branch: main

labels:
  runner: k8s

steps:
  - name: check
    image: registry.ops.ciphera.net/mirror/docker.io/library/php:8.3-cli-alpine-74c3e6f3f78d@sha256:74c3e6f3f78d8bdd090b1d565ef0040c4cd8c7b3757996638cba05dcb87fc94a
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 64Mi, cpu: 50m }
          limits: { memory: 256Mi }
    commands:
      - php --version
      # The file count is asserted too: a find that matches nothing would lint
      # nothing and pass.
      - |
        find . -path ./.git -prune -o -type f -name '*.php' -print | sort > /tmp/php-files.txt
        COUNT=$(wc -l < /tmp/php-files.txt)
        echo "linting $COUNT PHP file(s)"
        [ "$COUNT" -ge 3 ] || { echo "REFUSING: expected at least 3 PHP files, found $COUNT."; exit 1; }
        FAILED=0
        while read -r f; do
          php -l "$f" > /tmp/lint.out 2>&1 || { cat /tmp/lint.out; FAILED=1; }
        done < /tmp/php-files.txt
        [ "$FAILED" -eq 0 ] || exit 1
      - |
        php -r 'foreach (array_slice($argv, 1) as $f) { $d = new DOMDocument(); if (!@$d->load($f)) { fwrite(STDERR, "not well-formed XML: $f\n"); exit(1); } echo "well-formed: $f\n"; }' pulseanalytics.xml pulse-update.xml
      - |
        php -r 'foreach (array_slice($argv, 1) as $f) { $r = @parse_ini_file($f, false, INI_SCANNER_RAW); if ($r === false) { fwrite(STDERR, "not a valid INI file: $f\n"); exit(1); } echo "ini ok (" . count($r) . " keys): $f\n"; }' language/en-GB/*.ini
